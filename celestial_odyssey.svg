<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="35%" stop-color="#0C1B2F"/>
      <stop offset="70%" stop-color="#14283F"/>
      <stop offset="100%" stop-color="#08101C"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="20%" y1="10%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="40%" stop-color="rgba(180, 220, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>
    <radialGradient id="lightOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#70C8FF"/>
      <stop offset="60%" stop-color="rgba(0, 160, 255, 0.3)"/>
      <stop offset="100%" stop-color="rgba(0, 80, 255, 0)"/>
    </radialGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#skyGrad)"/>

  <!-- Rolling Moonlit Mountains & Tree Canopy -->
  <path d="M 0 450 Q 180 380 340 460 T 720 420 L 720 1280 L 0 1280 Z" fill="#0A1826" />
  <path d="M 0 680 Q 240 600 480 670 T 720 640 L 720 1280 L 0 1280 Z" fill="#0F2432" />

  <!-- Lush Emerald Foreground Shore -->
  <path d="M 0 850 C 140 820 220 900 360 920 C 480 940 620 890 720 940 L 720 1280 L 0 1280 Z" fill="#143626" />
  <!-- Tranquil Reflective Water -->
  <path d="M 0 1020 C 160 990 320 1040 480 1010 T 720 1030 L 720 1280 L 0 1280 Z" fill="#081A24" opacity="0.9" />

  <!-- Diagonal Celestial Beam of Star Dust -->
  <polygon points="260,180 720,480 720,1100 320,850" fill="url(#beamGrad)" />

  <!-- Majestic Stone Guardian Statue with Wings -->
  <g transform="translate(140, 220)">
    <!-- Wings -->
    <path d="M 0 180 C -80 120 -90 20 -20 -40 C -10 60 10 120 40 180 Z" fill="#1C182B" opacity="0.9" />
    <!-- Robed Body -->
    <path d="M 20 40 Q 60 -10 80 40 L 100 240 C 90 340 70 420 50 520 L -10 520 C 0 420 0 340 10 240 Z" fill="#C9CFD6" />
    <path d="M 40 40 Q 70 80 60 220 L 40 520 L 20 520 Q 30 240 25 80 Z" fill="#A5ACB5" />
    <!-- Hood / Head -->
    <path d="M 35 15 C 35 -15 75 -15 75 15 C 75 35 35 35 35 15 Z" fill="#88909A" />
    <ellipse cx="55" cy="18" rx="14" ry="18" fill="#121820" />
  </g>

  <!-- Glowing Seeker in Wooden Boat on Water -->
  <path d="M 520 1040 C 560 1020 660 1025 690 1060 C 650 1080 550 1080 520 1040 Z" fill="#2E1C12" />
  <!-- Radiant Light Orb -->
  <circle cx="610" cy="980" r="120" fill="url(#lightOrb)" />
  <circle cx="610" cy="980" r="18" fill="#FFFFFF" />

  <!-- Stars Scattering -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="340" cy="280" r="2.5"/><circle cx="380" cy="340" r="2"/><circle cx="430" cy="390" r="3"/>
    <circle cx="490" cy="460" r="2"/><circle cx="540" cy="520" r="2.5"/><circle cx="580" cy="620" r="3"/>
    <circle cx="630" cy="740" r="2.5"/><circle cx="660" cy="830" r="3.5"/><circle cx="410" cy="520" r="1.5"/>
    <circle cx="470" cy="620" r="2"/><circle cx="520" cy="710" r="1.8"/><circle cx="370" cy="680" r="2.5"/>
    <circle cx="300" cy="580" r="2"/><circle cx="210" cy="120" r="2.2"/><circle cx="120" cy="80" r="1.8"/>
    <circle cx="620" cy="160" r="2.8"/><circle cx="660" cy="90" r="2"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1a24"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="liquidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="190" stroke="url(#goldGrad)" stroke-width="6" fill="none" opacity="0.3"/>
  <ellipse cx="256" cy="256" rx="200" ry="80" stroke="url(#goldGrad)" stroke-width="8" fill="none" transform="rotate(-30 256 256)" opacity="0.75" filter="url(#liquidGlow)"/>
  <ellipse cx="256" cy="256" rx="200" ry="80" stroke="#FFF" stroke-width="4" fill="none" transform="rotate(30 256 256)" opacity="0.35"/>
  <circle cx="256" cy="256" r="54" fill="url(#goldGrad)" filter="url(#liquidGlow)"/>
  <circle cx="256" cy="256" r="32" fill="#08080A"/>
  <circle cx="410" cy="180" r="18" fill="url(#goldGrad)" filter="url(#liquidGlow)"/>
  <circle cx="110" cy="320" r="12" fill="#FFF" opacity="0.8"/>
</svg>

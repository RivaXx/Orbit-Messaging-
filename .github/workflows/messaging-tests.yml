name: Orbit messaging tests
on:
  pull_request:
  push:
    branches: [main, feat-messaging-experience, fix/album-index-and-queue]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run browser-logic regression tests
        run: node --test tests/*.test.cjs tests/*.test.mjs

      - name: Install isolated PostgreSQL test engine
        run: npm install --prefix "$RUNNER_TEMP/orbit-pg-check" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.13
      - name: Reproduce and repair oversized album indexes in PostgreSQL
        env:
          NODE_PATH: ${{ runner.temp }}/orbit-pg-check/node_modules
        run: node --test tests/album-index.pg.cjs

name: Orbit messaging tests
on:
  pull_request:
  push:
    branches: [main, feat-messaging-experience]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run browser-logic regression tests
        run: node --test tests/*.test.cjs

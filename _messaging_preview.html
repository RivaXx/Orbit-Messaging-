<!doctype html><html><head><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chat-upgrades.css"><link rel="stylesheet" href="photo-weather.css"><link rel="stylesheet" href="messaging-experience.css"><style>body{display:block!important;overflow:auto!important;height:auto!important;min-height:100vh;background:#101821!important}#sample-feed{display:flex;flex-direction:column;gap:12px}#sample-feed .msg-bubble-row{width:100%}.media-preview-fullscreen-modal{height:100dvh}</style></head><body><main style="max-width:410px;margin:30px auto;padding:18px;border:1px solid var(--glass-border);border-radius:24px;background:var(--glass-card)"><h2 style="font-size:20px">Orbit · messaging preview</h2><p style="color:var(--text-secondary);font-size:12px">Synthetic examples · no messages sent</p><div id="main-chats-list"></div><h3 style="font-size:13px;margin-top:24px">PHOTO ALBUM</h3><div id="sample-feed"></div><h3 style="font-size:13px;margin-top:24px">GROUPS</h3><div id="groups-list"></div><div style="display:flex;gap:10px;margin-top:18px"><button onclick="openMediaPreviewScreen(previewPhotos)" class="glass-btn-primary">Photo quality</button><button onclick="openAddAlarmModal()" class="glass-btn-primary">Alarm settings</button></div></main><div id="modal-media-lightbox" class="media-viewer-modal">

                <button class="btn-reset" onclick="zoomLightboxIn(event)" style="color:#fff; font-size:18px; padding:6px;" title="Zoom In"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button class="btn-reset" onclick="zoomLightboxOut(event)" style="color:#fff; font-size:18px; padding:6px;" title="Zoom Out"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                <button class="btn-reset" onclick="shareCurrentLightboxMedia()" style="color:#fff; font-size:18px; padding:6px;" title="Share"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
                <button class="btn-reset" onclick="downloadCurrentLightboxMedia()" style="color:#fff; font-size:18px; padding:6px;" title="Download"><i class="fa-solid fa-download"></i></button>
                <button class="btn-reset" onclick="closeMediaLightbox()" style="color:#fff; font-size:22px; padding:6px;" title="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="lightbox-content" style="flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;">

            <button id="lightbox-next-btn" class="lightbox-nav-btn next touch-fix" onclick="nextLightboxImage(event)" title="Next Image" aria-label="Next Image"><i class="fa-solid fa-chevron-right"></i></button>
            <img id="lightbox-img" src="" alt="Media" style="max-width:100%; max-height:100%; object-fit:contain; transition:transform 0.2s ease;">
        </div>
        <!-- Bottom Chronological Thumbnail Filmstrip -->
        <div id="lightbox-thumbnail-strip" class="lightbox-thumbnail-strip"></div>
    </div><div id="modal-media-preview" class="media-preview-fullscreen-modal hide">
